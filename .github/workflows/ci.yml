name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The merge gate (scripts/gate.sh): the static checks, the engine's self-check and every tests/*.mjs. The same
      # script runs locally (--fast for the static part).
      - name: Gate
        run: scripts/gate.sh
