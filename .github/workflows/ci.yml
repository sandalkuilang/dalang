name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The merge gate (scripts/gate.sh): the static checks, the engine's self-check and every tests/*.mjs. The same
      # script runs locally (--fast for the static part).
      # ffmpeg is no longer on the runner image; the audio, trace and media tests need it.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Gate
        run: scripts/gate.sh
