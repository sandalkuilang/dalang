name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The merge gate: syntax, SKILL.md front-matter, README diagrams, the engine's self-check and preflight
      # against a mock VoiceStudio. The same script runs locally (scripts/gate.sh, --fast for the static part).
      - name: Gate
        run: scripts/gate.sh
