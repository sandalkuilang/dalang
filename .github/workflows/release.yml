name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag that fails the checks never becomes a release.
      - name: Verify scripts
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          bash -n scripts/measure_reference.sh

      - name: Verify SKILL.md front-matter
        run: |
          head -1 SKILL.md | grep -qx -- '---'
          grep -q '^name: dalang$' SKILL.md
          grep -q '^description: ' SKILL.md

      - name: Verify plugin.json version
        run: |
          v=$(node -p 'require("./.claude-plugin/plugin.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::.claude-plugin/plugin.json is $v, the tag is $GITHUB_REF_NAME"; exit 1; }

      # The hand-written section becomes the body; GitHub appends the commit/PR list.
      - name: Take this version's section out of CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]"  { on = 1; next }
            on && /^## \[/          { exit }   # the next version
            on && /^\[[^]]+\]: http/ { exit }   # the link definitions at the foot
            on                      { print }
          ' CHANGELOG.md > notes.md
          # No section for this tag is a mistake, not a release.
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v1.1.0-rc.1 is published as a pre-release.
          case "$GITHUB_REF_NAME" in *-*) FLAG=--prerelease ;; *) FLAG= ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            $FLAG
