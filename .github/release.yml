# Categories for GitHub's auto-generated release notes (`--generate-notes`).
changelog:
  exclude:
    labels: [ignore-for-release]
    authors: [dependabot, github-actions]
  categories:
    - title: ✨ Pipeline & features
      labels: [feature, enhancement]
    - title: 🎨 Visual direction & craft
      labels: [visuals, craft]
    - title: 🎙️ Voice & timing
      labels: [voice, timing]
    - title: 🐛 Fixes
      labels: [bug, fix]
    - title: 📚 Docs
      labels: [documentation, docs]
    - title: 🔧 Tooling & CI
      labels: [chore, ci, tooling]
    - title: Other changes
      labels: ['*']
