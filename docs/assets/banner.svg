<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" width="1200" height="396" role="img" aria-labelledby="ttl desc">
<title id="ttl">Dalang</title>
<desc id="desc">Dalang — any topic becomes a finished animated video. A puppet master's control bar drops strings onto spoken words; each string runs straight down to the start of a scene, because every cut lands on a word.</desc>
<style>
:root{--bg:#0b0d13;--panel:#121620;--line:#262c3a;--tx:#eef0f5;--mu:#9097a8;--dim:#5d6476;--amber:#f0a05a;--amsoft:#2a1d12;--amtx:#ffd6ad;--sig:#7ea6ff;--sigsoft:#141b2e;--sigtx:#c9d6ff;--wave:#3c5a9a}
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
.mono,.wt,.wt-hot,.bl,.st,.pill-t,.thesis{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.frame{fill:var(--bg);stroke:var(--line);stroke-width:1}
.pill{fill:var(--amsoft);stroke:var(--amber);stroke-opacity:.45;stroke-width:1}
.pill-t{font-size:14px;font-weight:600;letter-spacing:2px;fill:var(--amber)}
.word{font-size:112px;font-weight:760;letter-spacing:-4px;fill:url(#ink)}
.tag{font-size:30px;font-weight:500;letter-spacing:-.5px;fill:var(--mu)}
.tag-b{fill:var(--tx)}
.thesis{font-size:16px;fill:var(--mu)}
.bar{fill:var(--line)}
.str{fill:none;stroke:var(--amber);stroke-width:1.4;stroke-opacity:.8}
.knot{fill:var(--amber)}
.bl{font-size:16px;font-weight:600;fill:var(--amber)}
.guide{stroke:var(--amber);stroke-width:1.2;stroke-dasharray:3 4;opacity:.55}
.wb{fill:var(--sigsoft);stroke:var(--sig);stroke-opacity:.45;stroke-width:1}
.wb-hot{fill:var(--amsoft);stroke:var(--amber);stroke-width:1.3}
.wt{font-size:20px;fill:var(--sigtx);text-anchor:middle}
.wt-hot{font-size:20px;font-weight:600;fill:var(--amtx);text-anchor:middle}
.wave{fill:var(--wave)}
.sc{fill:var(--panel);stroke:var(--line);stroke-width:1}
.sc-edge{fill:var(--amber)}
.st{font-size:16px;fill:var(--mu)}
.ph{stroke:var(--tx);stroke-width:1.2;opacity:.45}

/* The playhead reads the narration; each word lights as it is spoken. */
@keyframes sweep{0%{transform:translateX(0);opacity:0}3%{opacity:1}97%{opacity:1}100%{transform:translateX(596px);opacity:0}}
@keyframes lit{0%{opacity:.28}9%{opacity:0}100%{opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
.playhead{animation:sweep 7.0s linear infinite}
.flash{fill:#fff;opacity:0;animation:lit 7.0s linear infinite}
.sway{transform-box:view-box;animation:sway 6.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.playhead,.flash,.sway{animation:none}.playhead{opacity:0}}
</style>
<defs>
<linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#b9bfcc"/></linearGradient>
<linearGradient id="mark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7b878"/><stop offset="100%" stop-color="#e2863a"/></linearGradient>
<!-- each letter of the name arrives out of focus and sharpens -->
<filter id="bl0" filterUnits="userSpaceOnUse" x="140" y="60" width="420" height="220"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="12;0" keyTimes="0;1" calcMode="spline" keySplines=".3 .7 .3 1" begin="0.30s" dur=".7s" fill="freeze"/></feGaussianBlur></filter>
<filter id="bl1" filterUnits="userSpaceOnUse" x="140" y="60" width="420" height="220"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="12;0" keyTimes="0;1" calcMode="spline" keySplines=".3 .7 .3 1" begin="0.37s" dur=".7s" fill="freeze"/></feGaussianBlur></filter>
<filter id="bl2" filterUnits="userSpaceOnUse" x="140" y="60" width="420" height="220"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="12;0" keyTimes="0;1" calcMode="spline" keySplines=".3 .7 .3 1" begin="0.44s" dur=".7s" fill="freeze"/></feGaussianBlur></filter>
<filter id="bl3" filterUnits="userSpaceOnUse" x="140" y="60" width="420" height="220"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="12;0" keyTimes="0;1" calcMode="spline" keySplines=".3 .7 .3 1" begin="0.51s" dur=".7s" fill="freeze"/></feGaussianBlur></filter>
<filter id="bl4" filterUnits="userSpaceOnUse" x="140" y="60" width="420" height="220"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="12;0" keyTimes="0;1" calcMode="spline" keySplines=".3 .7 .3 1" begin="0.58s" dur=".7s" fill="freeze"/></feGaussianBlur></filter>
<filter id="bl5" filterUnits="userSpaceOnUse" x="140" y="60" width="420" height="220"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="12;0" keyTimes="0;1" calcMode="spline" keySplines=".3 .7 .3 1" begin="0.65s" dur=".7s" fill="freeze"/></feGaussianBlur></filter>
<radialGradient id="lamp" cx="50%" cy="0%" r="70%"><stop offset="0%" stop-color="#f0a05a" stop-opacity=".16"/><stop offset="100%" stop-color="#f0a05a" stop-opacity="0"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f0a05a" stop-opacity="0"/><stop offset="50%" stop-color="#f0a05a" stop-opacity=".6"/><stop offset="100%" stop-color="#f0a05a" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="394" rx="20"/></clipPath>
</defs>

<rect class="frame" x="1" y="1" width="1198" height="394" rx="20"/>
<g clip-path="url(#clip)">
<rect width="1200" height="396" fill="url(#dots)"/>
<ellipse cx="838" cy="0" rx="460" ry="300" fill="url(#lamp)"/>
<rect x="520" y="1" width="640" height="1" fill="url(#rim)"/>
</g>

<!-- left: the name and the promise -->
<rect class="pill" x="64" y="56" width="224" height="32" rx="16"/><circle class="knot" cx="84" cy="72" r="4"/>
<text class="pill-t" x="98" y="77">CLAUDE CODE SKILL</text>
<!-- the mark (logo.svg) arrives first, then the name letter by letter -->
<g transform="translate(64 118) scale(1.25)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0s" dur=".45s" fill="freeze"/>
<rect width="64" height="64" rx="16" fill="url(#mark)"/><path d="M17 13H32a19 19 0 0 1 0 38H17Z" fill="#0b0d13"/><path d="M26 23.5 40 32 26 40.5Z" fill="#f0a05a"/></g>
<text class="word" x="162"><tspan y="198" fill-opacity="0" filter="url(#bl0)">D<animate attributeName="fill-opacity" from="0" to="1" begin="0.30s" dur=".7s" fill="freeze"/></tspan><tspan y="198" fill-opacity="0" filter="url(#bl1)">a<animate attributeName="fill-opacity" from="0" to="1" begin="0.37s" dur=".7s" fill="freeze"/></tspan><tspan y="198" fill-opacity="0" filter="url(#bl2)">l<animate attributeName="fill-opacity" from="0" to="1" begin="0.44s" dur=".7s" fill="freeze"/></tspan><tspan y="198" fill-opacity="0" filter="url(#bl3)">a<animate attributeName="fill-opacity" from="0" to="1" begin="0.51s" dur=".7s" fill="freeze"/></tspan><tspan y="198" fill-opacity="0" filter="url(#bl4)">n<animate attributeName="fill-opacity" from="0" to="1" begin="0.58s" dur=".7s" fill="freeze"/></tspan><tspan y="198" fill-opacity="0" filter="url(#bl5)">g<animate attributeName="fill-opacity" from="0" to="1" begin="0.65s" dur=".7s" fill="freeze"/></tspan></text>
<text class="tag" x="64" y="250">Any topic →</text>
<text class="tag tag-b" x="64" y="290">a finished animated video.</text>
<text class="thesis" x="64" y="330"><tspan fill="var(--amber)">◆</tspan>  every cut lands on a spoken word</text>

<!-- right: the dalang's control bar, strings tied to words, words pinned to scenes -->
<rect class="bar" x="524" y="66" width="628" height="8" rx="4"/>
<g class="sway" style="transform-origin:540px 74px;animation-duration:6.4s;animation-delay:-0.0s"><path class="str" d="M540 74V202"/><circle class="knot" cx="540" cy="202" r="3.5"/></g><text class="bl" x="550" y="194">{hook}</text><path class="guide" d="M540 248V302"/><g class="sway" style="transform-origin:712px 74px;animation-duration:7.3s;animation-delay:-1.3s"><path class="str" d="M712 74V202"/><circle class="knot" cx="712" cy="202" r="3.5"/></g><text class="bl" x="722" y="194">{proof}</text><path class="guide" d="M712 248V302"/><g class="sway" style="transform-origin:976px 74px;animation-duration:8.2s;animation-delay:-2.6s"><path class="str" d="M976 74V202"/><circle class="knot" cx="976" cy="202" r="3.5"/></g><text class="bl" x="986" y="194">{payoff}</text><path class="guide" d="M976 248V302"/>
<g><rect class="wb-hot" x="540" y="208" width="56" height="38" rx="7"/><rect class="flash" x="540" y="208" width="56" height="38" rx="7" style="animation-delay:0.00s"/><text class="wt-hot" x="568.0" y="233.5">why</text></g><g><rect class="wb" x="608" y="208" width="88" height="38" rx="7"/><rect class="flash" x="608" y="208" width="88" height="38" rx="7" style="animation-delay:0.80s"/><text class="wt" x="652.0" y="233.5">steel</text></g><g><rect class="wb-hot" x="712" y="208" width="92" height="38" rx="7"/><rect class="flash" x="712" y="208" width="92" height="38" rx="7" style="animation-delay:2.02s"/><text class="wt-hot" x="758.0" y="233.5">ships</text></g><g><rect class="wb" x="816" y="208" width="84" height="38" rx="7"/><rect class="flash" x="816" y="208" width="84" height="38" rx="7" style="animation-delay:3.24s"/><text class="wt" x="858.0" y="233.5">float</text></g><g><rect class="wb" x="912" y="208" width="44" height="38" rx="7"/><rect class="flash" x="912" y="208" width="44" height="38" rx="7" style="animation-delay:4.18s"/><text class="wt" x="934.0" y="233.5">on</text></g><g><rect class="wb-hot" x="976" y="208" width="80" height="38" rx="7"/><rect class="flash" x="976" y="208" width="80" height="38" rx="7" style="animation-delay:5.12s"/><text class="wt-hot" x="1016.0" y="233.5">deep</text></g><g><rect class="wb" x="1068" y="208" width="84" height="38" rx="7"/><rect class="flash" x="1068" y="208" width="84" height="38" rx="7" style="animation-delay:6.20s"/><text class="wt" x="1110.0" y="233.5">water</text></g>
<g class="wave"><rect x="540" y="263.0" width="4" height="28" rx="2"/><rect x="548" y="269.0" width="4" height="16" rx="2"/><rect x="556" y="261.0" width="4" height="32" rx="2"/><rect x="564" y="273.0" width="4" height="8" rx="2"/><rect x="572" y="271.0" width="4" height="12" rx="2"/><rect x="580" y="270.0" width="4" height="14" rx="2"/><rect x="588" y="271.0" width="4" height="12" rx="2"/><rect x="596" y="263.0" width="4" height="28" rx="2"/><rect x="604" y="273.0" width="4" height="8" rx="2"/><rect x="612" y="270.0" width="4" height="14" rx="2"/><rect x="620" y="267.0" width="4" height="20" rx="2"/><rect x="628" y="273.0" width="4" height="8" rx="2"/><rect x="636" y="271.0" width="4" height="12" rx="2"/><rect x="644" y="261.0" width="4" height="32" rx="2"/><rect x="652" y="261.0" width="4" height="32" rx="2"/><rect x="660" y="271.0" width="4" height="12" rx="2"/><rect x="668" y="267.0" width="4" height="20" rx="2"/><rect x="676" y="275.5" width="4" height="3" rx="2"/><rect x="684" y="275.5" width="4" height="3" rx="2"/><rect x="692" y="275.5" width="4" height="3" rx="2"/><rect x="700" y="275.5" width="4" height="3" rx="2"/><rect x="708" y="275.5" width="4" height="3" rx="2"/><rect x="716" y="271.0" width="4" height="12" rx="2"/><rect x="724" y="270.0" width="4" height="14" rx="2"/><rect x="732" y="261.0" width="4" height="32" rx="2"/><rect x="740" y="273.0" width="4" height="8" rx="2"/><rect x="748" y="271.0" width="4" height="12" rx="2"/><rect x="756" y="267.0" width="4" height="20" rx="2"/><rect x="764" y="273.0" width="4" height="8" rx="2"/><rect x="772" y="261.0" width="4" height="32" rx="2"/><rect x="780" y="273.0" width="4" height="8" rx="2"/><rect x="788" y="267.0" width="4" height="20" rx="2"/><rect x="796" y="273.0" width="4" height="8" rx="2"/><rect x="804" y="270.0" width="4" height="14" rx="2"/><rect x="812" y="269.0" width="4" height="16" rx="2"/><rect x="820" y="265.0" width="4" height="24" rx="2"/><rect x="828" y="261.0" width="4" height="32" rx="2"/><rect x="836" y="269.0" width="4" height="16" rx="2"/><rect x="844" y="270.0" width="4" height="14" rx="2"/><rect x="852" y="271.0" width="4" height="12" rx="2"/><rect x="860" y="265.0" width="4" height="24" rx="2"/><rect x="868" y="270.0" width="4" height="14" rx="2"/><rect x="876" y="269.0" width="4" height="16" rx="2"/><rect x="884" y="271.0" width="4" height="12" rx="2"/><rect x="892" y="267.0" width="4" height="20" rx="2"/><rect x="900" y="263.0" width="4" height="28" rx="2"/><rect x="908" y="271.0" width="4" height="12" rx="2"/><rect x="916" y="270.0" width="4" height="14" rx="2"/><rect x="924" y="271.0" width="4" height="12" rx="2"/><rect x="932" y="273.0" width="4" height="8" rx="2"/><rect x="940" y="275.5" width="4" height="3" rx="2"/><rect x="948" y="275.5" width="4" height="3" rx="2"/><rect x="956" y="275.5" width="4" height="3" rx="2"/><rect x="964" y="275.5" width="4" height="3" rx="2"/><rect x="972" y="275.5" width="4" height="3" rx="2"/><rect x="980" y="267.0" width="4" height="20" rx="2"/><rect x="988" y="266.0" width="4" height="22" rx="2"/><rect x="996" y="270.0" width="4" height="14" rx="2"/><rect x="1004" y="261.0" width="4" height="32" rx="2"/><rect x="1012" y="263.0" width="4" height="28" rx="2"/><rect x="1020" y="266.0" width="4" height="22" rx="2"/><rect x="1028" y="266.0" width="4" height="22" rx="2"/><rect x="1036" y="263.0" width="4" height="28" rx="2"/><rect x="1044" y="265.0" width="4" height="24" rx="2"/><rect x="1052" y="267.0" width="4" height="20" rx="2"/><rect x="1060" y="269.0" width="4" height="16" rx="2"/><rect x="1068" y="267.0" width="4" height="20" rx="2"/><rect x="1076" y="271.0" width="4" height="12" rx="2"/><rect x="1084" y="265.0" width="4" height="24" rx="2"/><rect x="1092" y="270.0" width="4" height="14" rx="2"/><rect x="1100" y="266.0" width="4" height="22" rx="2"/><rect x="1108" y="263.0" width="4" height="28" rx="2"/><rect x="1116" y="266.0" width="4" height="22" rx="2"/><rect x="1124" y="265.0" width="4" height="24