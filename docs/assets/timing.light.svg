<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="ttl desc">
<title id="ttl">Why the per-word timing drives everything</title>
<desc id="desc">The narration audio is transcribed into per-word boxes. Named beats in the script mark exact word boundaries, and every scene starts on one of those beats instead of on a guessed second.</desc>
<style>
/*PALETTE*/
:root{--card:#ffffff;--card2:#ffffff;--bd:#d1d9e0;--tx:#1f2328;--mu:#59636e;--dim:#818b98;--ac:#bc4c2e;--acbd:#bc4c2e;--acsoft:#fdf1ec;--bl:#0969da;--blsoft:#eaf2fd;--tr:#d1d9e0;--wave:#6ea2d8}
/*ENDPALETTE*/
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:2.4px;fill:var(--dim)}
.lede{font-size:13.5px;fill:var(--mu)}
.rowlb{font-size:11px;fill:var(--dim);text-anchor:end}
.wave{fill:var(--wave);opacity:.85}
.wbox{fill:var(--blsoft);stroke:var(--bl);stroke-width:.8;opacity:.9}
.scene{fill:var(--card);stroke:var(--bd);stroke-width:1}
.scene-lb{font-size:11.5px;font-weight:600;fill:var(--mu);text-anchor:middle}
.snap{fill:var(--ac)}
.beat{stroke:var(--ac);stroke-width:1.2;stroke-dasharray:3 4;opacity:.6}
.beat-lb{font-size:11px;font-weight:600;fill:var(--ac);text-anchor:middle}
.rule{stroke:var(--tr);stroke-width:1}
.tick{stroke:var(--tr);stroke-width:1}
.tlb{font-size:10px;fill:var(--dim);text-anchor:middle}
.callout{font-size:11.5px;fill:var(--mu)}
.code{font-size:11.5px;fill:var(--ac)}
</style>

<text class="eyebrow" x="24" y="32">WORDS FIRST, PICTURES LAST</text>
<text class="lede" x="24" y="56">The voice is recorded before a single frame exists — so every change on screen lands on a word, not on a guessed second.</text>

<!-- beat guides -->
<g><line class="beat" x1="226" y1="98" x2="226" y2="262"/><path class="snap" d="M226 86l6 6-6 6-6-6Z"/><text class="beat-lb" x="226" y="80">{hook}</text></g>
<g><line class="beat" x1="541" y1="98" x2="541" y2="262"/><path class="snap" d="M541 86l6 6-6 6-6-6Z"/><text class="beat-lb" x="541" y="80">{proof}</text></g>
<g><line class="beat" x1="888" y1="98" x2="888" y2="262"/><path class="snap" d="M888 86l6 6-6 6-6-6Z"/><text class="beat-lb" x="888" y="80">{payoff}</text></g>

<!-- row 1: the recorded narration -->
<text class="rowlb mono" x="142" y="130">narration.mp3</text>
