<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="ttl desc">
<title id="ttl">Dalang</title>
<desc id="desc">Dalang — any topic becomes a finished animated video: script, AI voice, per-word timing, music, animated visuals.</desc>
<style>
/*PALETTE*/
:root{--card:#0d1117;--bd:#30363d;--tx:#e6edf3;--mu:#8b949e;--dim:#6e7681;--ac:#d97757;--acbd:#a8512e;--bl:#58a6ff;--beam:#d97757;--beamop:.13;--chip:#161b22}
/*ENDPALETTE*/
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.frame{fill:var(--card);stroke:var(--bd);stroke-width:1}
.word{font-size:62px;font-weight:700;letter-spacing:-1.5px;fill:var(--tx)}
.tag{font-size:19px;fill:var(--mu)}
.sub{font-size:13.5px;fill:var(--dim)}
.chip{fill:var(--chip);stroke:var(--bd);stroke-width:1}
.chip-t{font-size:11.5px;font-weight:600;fill:var(--mu)}
.rule{stroke:var(--bd);stroke-width:1}
.dot{fill:var(--ac)}
.dot-o{fill:none;stroke:var(--acbd);stroke-width:1.2}
.pup{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pupd{fill:none;stroke:var(--bd);stroke-width:1.2;stroke-linecap:round}

/* The strings hang, so they sway — each on its own length, as a pendulum does. */
@keyframes sway{0%,100%{transform:rotate(-.75deg)}50%{transform:rotate(.75deg)}}
@keyframes breathe{0%{transform:scale(1);opacity:.5}70%{opacity:0}100%{transform:scale(1.8);opacity:0}}
.sway{transform-box:view-box;animation:sway 6.5s ease-in-out infinite}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s cubic-bezier(.2,.6,.3,1) infinite}
@media (prefers-reduced-motion:reduce){.sway,.breathe{animation:none}.breathe{opacity:.35}}
</style>
<defs>
<radialGradient id="beam" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="var(--beam)" stop-opacity="var(--beamop)"/>
<stop offset="100%" stop-color="var(--beam)" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="var(--ac)" stop-opacity=".85"/>
<stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>
</linearGradient>
</defs>

<rect class="frame" x="1" y="1" width="1198" height="298" rx="18"/>
<ellipse cx="1000" cy="150" rx="420" ry="240" fill="url(#beam)"/>

<!-- the dalang's control bar: one hand, every puppet on a string -->
<rect x="955" y="56" width="180" height="9" rx="4.5" fill="var(--bd)"/>
<g class="sway" style="transform-origin:975px 65px;animation-duration:6.4s"><path class="pupd" d="M975 65v78"/><circle class="dot-o" cx="975" cy="148" r="5"/></g>
<g class="sway" style="transform-origin:1005px 65px;animation-duration:7.3s;animation-delay:-1.1s"><path class="pupd" d="M1005 65v108"/><circle class="dot-o" cx="1005" cy="178" r="5"/></g>
<g class="sway" style="transform-origin:1035px 65px;animation-duration:8.1s;animation-delay:-2.4s"><path class="pupd" d="M1035 65v133"/><circle class="breathe pup" cx="1035" cy="206" r="14" opacity=".5"/><circle class="dot" cx="1035" cy="206" r="8"/></g>
<g class="sway" style="transform-origin:1065px 65px;animation-duration:6.8s;animation-delay:-.6s"><path class="pupd" d="M1065 65v96"/><circle class="dot-o" cx="1065" cy="166" r="5"/></g>
<g class="sway" style="transform-origin:1095px 65px;animation-duration:7.7s;animation-delay:-3.2s"><path class="pupd" d="M1095 65v122"/><circle class="dot-o" cx="1095" cy="192" r="5"/></g>
<g class="sway" style="transform-origin:1125px 65px;animation-duration:6.1s;animation-delay:-1.8s"><path class="pupd" d="M1125 65v70"/><circle class="dot-o" cx="1125" cy="140" r="5"/></g>
<line x1="930" y1="238" x2="1160" y2="238" stroke="var(--bd)" stroke-width="1" opacity=".7"/>

<text class="word" x="64" y="118">Dalang</text>
<line class="rule" x1="64" y1="140" x2="620" y2="140" stroke="url(#fade)"/>
<text class="tag" x="64" y="172">Any topic → a finished animated video.</text>
<text class="sub" x="64" y="198">Script, AI voice, per-word timing, music, sound effects, animated visuals —</text>
<text class="sub" x="64" y="218">directed end to end, and stopped four times for your approval.</text>

<g>
<rect class="chip" x="64" y="240" width="112" height="26" rx="13"/><text class="chip-t mono" x="120" y="257" text-anchor="middle">any topic</text>
<rect class="chip" x="184" y="240" width="130" height="26" rx="13"/><text class="chip-t mono" x="249" y="257" text-anchor="middle">any language</text>
<rect class="chip" x="322" y="240" width="130" height="26" rx="13"/><text class="chip-t mono" x="387" y="257" text-anchor="middle">any platform</text>
<rect class="chip" x="460" y="240" width="150" height="26" rx="13"/><text class="chip-t mono" x="535" y="257" text-anchor="middle">4 approval gates</text>
</g>
</svg>
