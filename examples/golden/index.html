<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DALANG golden scene</title>
<style>
  html, body { margin: 0; background: #000; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  #out { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
</style>
</head>
<body>
<!-- The golden scene's renderer side (the scene itself is src/scene.js, DOM-free). One fixed composition that every skill
     version renders; scripts/golden.mjs copies it, with src/scene.js and assets/engine/, into a temp project. -->
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1280" data-height="720" data-fps="30">
  <canvas id="out" width="1280" height="720"></canvas>
</div>
<script type="module">
import { THREE, EffectComposer, RenderPass, EffectPass, N8AOPostPass, SMAAEffect, DepthOfFieldEffect, ToneMappingEffect, ToneMappingMode, RoomEnvironment } from "./assets/engine/three-vendor.js";
import { makeFinisher } from "./assets/engine/finish.js";
import { drawCaption, pinLabel, inkFor, luminance } from "./assets/engine/type.js";
import { CONFIG, CAPTIONS, buildScene } from "./src/scene.js";

const W = CONFIG.width, H = CONFIG.height, FORMAT = CONFIG.format;
const out = document.getElementById("out");
const ctx = out.getContext("2d", { willReadFrequently: true });

// A dimension line between two world points: end ticks, the text centred on it, in the ink the ground asks for, with a halo.
function dimLine(ctx, camera, from, to, text) {
  camera.updateMatrixWorld();
  const p = [from, to].map((w) => { const q = w.clone().project(camera); return { x: ((q.x + 1) / 2) * W, y: ((1 - q.y) / 2) * H, ok: Math.abs(q.x) <= 1 && Math.abs(q.y) <= 1 && q.z >= -1 && q.z <= 1 }; });
  if (!p[0].ok || !p[1].ok) return null;
  const px = 36 * (H / 1080) * 1.5, mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
  const dx = p[1].x - p[0].x, dy = p[1].y - p[0].y, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len, tick = 0.3 * px;
  const img = ctx.getImageData(Math.max(0, mx - 40), Math.max(0, my - 40), 80, 80);
  const ink = inkFor(luminance(img)), inkC = ink === "light" ? "#ffffff" : "#111111", haloC = ink === "light" ? "#111111" : "#ffffff";
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const [col, extra] of [[haloC, 0.1 * px], [inkC, 0]]) {
    ctx.strokeStyle = col; ctx.lineWidth = 0.07 * px + extra;
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y); ctx.lineTo(p[1].x, p[1].y);
    for (const q of p) { ctx.moveTo(q.x - nx * tick, q.y - ny * tick); ctx.lineTo(q.x + nx * tick, q.y + ny * tick); }
    ctx.stroke();
  }
  ctx.font = `700 ${px}px "Montserrat"`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.translate(mx - nx * 1.1 * px, my - ny * 1.1 * px);
  ctx.strokeStyle = haloC; ctx.lineWidth = 0.18 * px; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = inkC; ctx.fillText(text, 0, 0);
  ctx.restore();
  return { from: p[0], to: p[1] };
}

const S = buildScene({ aspect: W / H });
const camera = new THREE.PerspectiveCamera(30, W / H, 0.005, 12);
const gl = document.createElement("canvas");
gl.width = W; gl.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: false, stencil: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
S.flask.cut.ready(renderer);
const pmrem = new THREE.PMREMGenerator(renderer);
S.scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
S.scene.environmentIntensity = 0.8;

const composer = new EffectComposer(renderer, { stencilBuffer: true, multisampling: 0 });
composer.addPass(new RenderPass(S.scene, camera));
const ao = new N8AOPostPass(S.scene, camera, W, H);
ao.configuration.aoRadius = 0.04 / S.mpu; // 4 cm
ao.configuration.distanceFalloff = 1;
ao.configuration.intensity = 2.5;
ao.configuration.halfRes = false;
composer.addPass(ao);
const dof = new DepthOfFieldEffect(camera, { focusDistance: 0, focusRange: 3, bokehScale: 0.4 });
composer.addPass(new EffectPass(camera, dof, new ToneMappingEffect({ mode: ToneMappingMode.AGX })));
composer.addPass(new EffectPass(camera, new SMAAEffect()));

const finish = makeFinisher(out, { grain: 0.06, fps: CONFIG.fps });
const LABEL_OPTS = { format: FORMAT, font: "Montserrat" };

function renderAt(t) {
  S.at(t, camera);
  const d = S.dof(t);
  dof.target = d.focusPoint;
  dof.bokehScale = d.bokehScale;
  dof.circleOfConfusionMaterial.focusRange = d.focusRange;
  composer.render();
  finish.layer(gl, 0);
  finish.grade(t);
  // Overlays last, on the finished frame: the ink reads the ground under each box.
  if (S.dimVisible(t)) dimLine(ctx, camera, S.dim.from, S.dim.to, S.dim.text);
  for (const l of S.labelsAt(t)) pinLabel(ctx, { at: l.at, camera, text: l.text }, LABEL_OPTS);
  drawCaption(ctx, t, CAPTIONS, { format: FORMAT, font: "Montserrat" });
}

// Wait for the fonts before the first frame; a missing font shows in the render (a fallback face), it does not crash.
const ready = (document.fonts ? Promise.all([document.fonts.load('800 40px "Montserrat"'), document.fonts.load('700 40px "Montserrat"')]).catch(() => {}).then(() => document.fonts.ready) : Promise.resolve()).then(() => renderAt(0));
window.__hf = window.__hf || {};
window.__hf.buildReady = window.__hf.buildReady || {};
window.__hf.buildReady.golden = ready;
window.addEventListener("hf-seek", (e) => {
  const t = e.detail.time;
  if (e.detail.waitUntil) e.detail.waitUntil(ready.then(() => renderAt(t)));
  else ready.then(() => renderAt(t));
});
</script>
</body>
</html>
