<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- condensing_unit.clip.html (DALANG, MIT): a 7 s HyperFrames clip of condensing_unit.glb in the engine/three iso look:
     wide (the casing as blue x-ray glass) → medium (opened) → close (the compressor sectioned). Every value is a pure
     function of t on a paused GSAP timeline: the camera pans and zooms (iso: never a tilt) while the unit turns slowly
     one way; the fan turns from its motor's rpm, blurred over the frame's sweep; refrigerant pulses run along the
     discharge (red) and suction (blue) lines from the compressor's stroke rate; warm air leaves the grille behind the
     blades; each pin enters on its beat. Serve a folder with assets/ (node engine/three/build.mjs <dir>/assets), this
     page as index.html and the GLB, then: npx hyperframes render --fps 30 --output clip.mp4 -->
<title>Condensing unit clip</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #F3F2EE; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #F3F2EE; }
  #out { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920" data-fps="30">
  <canvas id="out" width="1080" height="1920" data-layout-ignore></canvas>
</div>
<script type="module">
import { THREE, GLTFLoader, EffectComposer, RenderPass, N8AOPostPass } from "./assets/three-vendor.js";
import { isoLook, inkLines } from "./assets/studio.js";
import { isoCamera, isoFrame, place } from "./assets/camera.js";

const W = 1080, H = 1920, DUR = 7, FPS = 30;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2), back = (u) => { u = clamp(u) - 1; return 1 + u * u * (2.7 * u + 1.7); };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.localClippingEnabled = true;
const scene = new THREE.Scene(), camera = isoCamera(W, H);
const ROLE = { sheet_metal: "#E4E6E8", aluminium_fin: "#B7BEC4", copper: "#C98A5C", black_steel: "#4A4E55", plastic_fan: "#E9E4D8", rubber: "#2E2F33", foam: "#55595F",
  pcb_green: "#4E9A68", casing_paint: "#EEEFEC", steel: "#9EA4AA", aluminium: "#C5CBD0", zinc: "#B8BEC4", brass: "#D4A84B" };
const HOT = "#E2553B", COLD = "#3E86C6", CALM = "#D8D6D0", XRAY = "#BCD6EC", XRAY_LINE = "#6F9CC6";

const unit = (await new GLTFLoader().loadAsync("./condensing_unit.glb")).scene;
const pivot = new THREE.Group(); pivot.add(unit); scene.add(pivot);
const named = (re) => { const out = []; unit.traverse((o) => { if (re.test(o.userData.name ?? o.name)) out.push(o); }); return out; };
const meshesOf = (objs) => { const m = []; for (const o of objs) o.traverse((x) => x.isMesh && m.push(x)); return m; };
unit.traverse((o) => { if (!o.isMesh) return; for (const m of [].concat(o.material)) { const r = Object.keys(ROLE).find((k) => (m.name || "").toLowerCase().includes(k)); if (r) m.color = new THREE.Color(ROLE[r]); } });
const own = (m) => { m.material = m.material.clone(); return m; };
const hotPipes = meshesOf(named(/^pipe\.discharge|^flare\.gas/)).map(own), coldPipes = meshesOf(named(/^pipe\.(suction|liquid)$|^pipe\.suction_accumulator|^flare\.liquid/)).map(own);
for (const m of hotPipes) m.material.color = new THREE.Color(HOT); for (const m of coldPipes) m.material.color = new THREE.Color(COLD);
isoLook(scene);
// the softer, graded matcap of the stills
const soft = (() => { const n = 64, d = new Uint8Array(n * n * 4), bk = new THREE.Vector3(1, 1, 1).normalize(), rt = new THREE.Vector3(1, 0, -1).normalize(), up = bk.clone().cross(rt), v = new THREE.Vector3();
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const x = ((i + 0.5) / n - 0.5) / 0.495, y = ((j + 0.5) / n - 0.5) / 0.495, z = Math.sqrt(Math.max(0, 1 - x * x - y * y));
    v.set(0, 0, 0).addScaledVector(rt, x).addScaledVector(up, y).addScaledVector(bk, z).normalize();
    const wt = Math.max(v.y, 0), wl = Math.max(v.z, 0), wr = Math.max(v.x, 0), s = wt + wl + wr || 1, f = (wt + wl * 0.88 + wr * 0.76) / s * (0.84 + 0.16 * Math.pow(z, 0.8)), o = (j * n + i) * 4;
    d[o] = d[o + 1] = d[o + 2] = Math.round(255 * Math.min(1, f)); d[o + 3] = 255; }
  const t = new THREE.DataTexture(d, n, n); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t; })();
scene.traverse((o) => { if (o.isMesh) for (const m of [].concat(o.material)) if (m.isMeshMatcapMaterial) m.matcap = soft; });

// refrigerant: a bright pulse runs along each coded line. A swept pipe's vertices are written ring after ring, so a
// vertex's index is its place along the pipe; the pulse moves at the compressor's stroke rate (rotary: one stroke a turn)
const flowT = { value: 0 };
for (const m of [...hotPipes, ...coldPipes]) {
  const n = m.geometry.attributes.position.count, s = new Float32Array(n); for (let i = 0; i < n; i++) s[i] = i / n;
  m.geometry.setAttribute("aS", new THREE.BufferAttribute(s, 1));
  m.material.onBeforeCompile = (sh) => { sh.uniforms.uFlow = flowT;
    sh.vertexShader = "attribute float aS;\nvarying float vS;\n" + sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\nvS = aS;");
    sh.fragmentShader = "uniform float uFlow;\nvarying float vS;\n" + sh.fragmentShader.replace("#include <dithering_fragment>", "#include <dithering_fragment>\nfloat p = smoothstep(0.75, 1.0, fract(vS * 9.0 - uFlow));\ngl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0, 0.96, 0.86), 0.55 * p);"); };
}
// the casing as x-ray glass (it fades out on the way to medium); the context (calm greys on the close)
const casing = meshesOf(named(/^casing\.|^grille\./)).map(own);
for (const m of casing) Object.assign(m.material, { color: new THREE.Color(XRAY), transparent: true, opacity: 0.3, depthWrite: false });
const context = meshesOf(named(/^(coil\.|bracket\.|insulation\.field|pipe\.field|valve\.expansion|pipe\.strainer|pipe\.liquid_valve)/)).map(own);
const ctxFrom = context.map((m) => m.material.color.clone()), calm = new THREE.Color(CALM);
const quarters = meshesOf(named(/\.quarter$/)).map(own), front = meshesOf(named(/^(pipe\.suction|fan\.|pcb|divider|insulation\.divider)/)).map(own);
for (const m of [...quarters, ...front]) Object.assign(m.material, { transparent: true });
inkLines(scene, { color: "#2A2926", angle: 28 });
for (const m of casing) m.children.filter((c) => c.userData.inkLine).forEach((c) => { c.geometry = new THREE.EdgesGeometry(m.geometry, 1); c.material = new THREE.LineBasicMaterial({ color: XRAY_LINE, transparent: true, opacity: 0.75 }); });
const lineOf = (m) => m.children.find((c) => c.userData.inkLine);
for (const m of [...quarters, ...front]) { const l = lineOf(m); if (l) { l.material = l.material.clone(); l.material.transparent = true; } }

// the fan, blurred over the frame's sweep: copies of the blade trailing it, each fainter
const fan = named(/^fan\.blade$/)[0], RPM = 850, ghosts = [];
if (fan) for (let i = 1; i <= 5; i++) { const g = fan.clone(true); g.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); Object.assign(o.material, { transparent: true, opacity: 0.32 - i * 0.045, depthWrite: false }); } if (o.userData.inkLine) o.visible = false; }); fan.parent.add(g); ghosts.push([g, i]); }
// warm air: arrows leaving the grille, carried by the blades
const fanLocal = unit.worldToLocal(fan.getWorldPosition(new THREE.Vector3())), arrows = [];   // read before any turn
for (let i = 0; i < 12; i++) { const mat = new THREE.MeshBasicMaterial({ color: HOT, transparent: true }), gr = new THREE.Group();
  const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.09, 8), mat), hd = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.04, 12), mat);
  sh.rotation.x = hd.rotation.x = Math.PI / 2; hd.position.z = 0.065; gr.add(sh, hd); unit.add(gr); arrows.push([gr, mat, i]); }

// camera stations: the iso camera pans and zooms (never tilts) between three frames of the unit
const compBox = new THREE.Box3(); for (const o of named(/^compressor\.(shell|stator|windings|pump|rotor|shaft|piston|feet|terminal)/)) compBox.expandByObject(o);
const inner = new THREE.Box3(); for (const o of named(/^(fan\.blade|compressor\.shell|coil\.fins|pcb\.box|valve\.gas)$/)) inner.expandByObject(o);
const WIDE = isoFrame(unit, { W, H, margin: 1.05 }), MED = isoFrame(inner, { W, H, margin: 1.08 }), CLOSE = isoFrame(compBox, { W, H, margin: 1.25 });
const lerpPose = (a, b, u) => ({ target: a.target.clone().lerp(b.target, u), k: Math.exp(Math.log(a.k) + (Math.log(b.k) - Math.log(a.k)) * u) });
const poseAt = (t) => t < 2.6 ? lerpPose(WIDE, MED, ease(seg(t, 1.5, 2.6))) : lerpPose(MED, CLOSE, ease(seg(t, 3.8, 5.0)));

// pins on their beats: [part, where, enters at]
const PINS = [["fan.blade", null, 0.6], ["coil.bends", null, 2.9], ["compressor.shell", null, 3.3], ["compressor.windings", "top", 5.3], ["compressor.rotor", null, 5.7], ["compressor.piston", "bottom", 6.1]];
const composer = new EffectComposer(renderer, { stencilBuffer: true, multisampling: 0 });
composer.addPass(new RenderPass(scene, camera));
const ao = new N8AOPostPass(scene, camera, W, H);
Object.assign(ao.configuration, { aoRadius: 0.04, distanceFalloff: 0.6, intensity: 1.6, halfRes: false, color: new THREE.Color("#2A2926") });
composer.addPass(ao);
const out = document.getElementById("out"), g = out.getContext("2d");

function frame(t) {
  pivot.rotation.y = THREE.MathUtils.degToRad(-4 + 10 * (t / DUR));                    // the slow one-way turn
  const turn = (RPM / 60) * Math.PI * 2;                                                 // rad per second
  if (fan) { fan.rotation.z = turn * t; for (const [gh, i] of ghosts) gh.rotation.z = turn * (t - (i / 5) / FPS); }
  flowT.value = t * 1.4;
  const xr = 1 - seg(t, 2.0, 2.8);                                                       // the glass fades on the way to medium
  for (const m of casing) { m.material.opacity = 0.3 * xr; m.visible = xr > 0.001; const l = lineOf(m); if (l) l.material.opacity = 0.75 * xr; }
  const cut = seg(t, 4.3, 4.9);                                                          // the section opens on the way to close
  for (const m of [...quarters, ...front]) { m.material.opacity = 1 - cut; m.material.depthWrite = cut < 0.5; m.visible = cut < 0.999; const l = lineOf(m); if (l) l.material.opacity = 1 - cut; }
  for (const gh of ghosts) gh[0].visible = cut < 0.999;
  context.forEach((m, i) => m.material.color.copy(ctxFrom[i]).lerp(calm, seg(t, 4.0, 4.8)));
  arrows.forEach(([gr, mat, i]) => { const a = (i / 12) * Math.PI * 2, r = 0.06 + (i % 3) * 0.055, u = (t * 1.6 + i * 0.37) % 1, local = fanLocal;
    gr.position.set(local.x + Math.cos(a) * r, local.y + Math.sin(a) * r, local.z + 0.12 + u * 0.32); mat.opacity = 0.9 * (1 - u) * (1 - seg(t, 3.6, 4.2)); gr.visible = mat.opacity > 0.01; });
  const pose = poseAt(t); place(camera, pose);
  renderer.clear(); composer.render();                                                   // the composer turns autoClear off: clear by hand or the last frame shows through
  // the frame: grid paper, the render, the pins, crop marks
  g.fillStyle = "#F3F2EE"; g.fillRect(0, 0, W, H); g.strokeStyle = "#E1E0DA"; g.lineWidth = 1;
  for (let x = 0; x <= W; x += 27) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
  for (let y = 0; y <= H; y += 27) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
  g.drawImage(renderer.domElement, 0, 0);
  PINS.forEach(([n, where, at], i) => { const a = seg(t, at, at + 0.35); if (a <= 0) return; const o = named(new RegExp("^" + n.replace(".", "\\.") + "$"))[0]; if (!o || !o.visible) return;
    if (i < 3 && t > 4.4) return;                                                         // the first beats' pins leave for the close
    const b = new THREE.Box3().setFromObject(o); if (where === "top") b.min.y = b.max.y - 0.15 * (b.max.y - b.min.y); if (where === "bottom") b.max.y = b.min.y + 0.25 * (b.max.y - b.min.y);
    const v = b.getCenter(new THREE.Vector3()).project(camera), x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H, dx = i % 2 ? 1 : -1, dy = i % 3 === 2 ? 1 : -1, px = x + dx * 120, py = y + dy * 50, s = back(a);
    g.globalAlpha = clamp(a * 2); g.strokeStyle = "#1E1E20"; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (px - x) * clamp(a * 1.6), y + (py - y) * clamp(a * 1.6)); g.stroke();
    g.fillStyle = "#1E1E20"; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill();
    g.fillStyle = "#F3F2EE"; g.beginPath(); g.arc(px, py, 33 * s, 0, 7); g.fill(); g.fillStyle = "#1E1E20"; g.beginPath(); g.arc(px, py, 28 * s, 0, 7); g.fill();
    g.fillStyle = "#fff"; g.font = "700 30px Helvetica Neue, Arial"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(String(i < 3 ? i + 1 : i - 2), px, py + 1); g.globalAlpha = 1; });
  g.strokeStyle = "#8C8B85"; g.lineWidth = 3; for (const [x, y, dx, dy] of [[30, 30, 1, 1], [W - 30, 30, -1, 1], [30, H - 30, 1, -1], [W - 30, H - 30, -1, -1]]) { g.beginPath(); g.moveTo(x, y + 36 * dy); g.lineTo(x, y); g.lineTo(x + 36 * dx, y); g.stroke(); }
}

const tl = gsap.timeline({ paused: true });
tl.to({ v: 0 }, { v: 1, duration: DUR, ease: "none" }, 0);
tl.eventCallback("onUpdate", () => frame(tl.time()));
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
frame(0);
</script>
</body>
</html>
